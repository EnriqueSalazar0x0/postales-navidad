<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postales de Navidad · Sangregorio Construcción</title>
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#222;--mute:#6b625c;--red:#c1272d;--green:#1f6b4a;--yellow:#f5b800;--dark:#2a2a2a;--line:#e2d8c8}
@media (prefers-color-scheme:dark){:root{--bg:#181716;--card:#242220;--ink:#f3ece4;--mute:#a89f97;--red:#e5545c;--green:#5cc592;--line:#3a3531}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.45}
header{background:var(--dark);color:#fff;text-align:center;padding:22px 16px 26px;position:relative;
 background-image:radial-gradient(circle,rgba(255,255,255,.55) 1.5px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.3) 1px,transparent 1.5px);background-size:46px 46px,29px 29px;background-position:0 0,14px 18px}
header:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#222 14px 28px)}
header .co{display:inline-block;background:var(--yellow);color:#222;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.8rem;padding:4px 12px;border-radius:4px;margin-bottom:8px}
header h1{margin:0;font-size:1.9rem}header p{margin:6px 0 0;color:#e8dfd3}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}.sub{color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
button,.btn{background:var(--yellow);color:#222;font-weight:700;border:0;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:600}
button.on{background:var(--dark);color:var(--yellow);border-color:var(--yellow)}
button.vote{background:var(--red);color:#fff;border:0}button.vote.done{background:var(--green)}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--yellow);border-radius:10px;overflow:hidden}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.card.sel{border-top-color:var(--green);box-shadow:0 0 0 3px var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:8px}
.note{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.tag{font-size:.85rem;color:var(--mute)}.win{color:var(--green);font-weight:800}
input[type=file]{display:none}input[type=text],input[type=password]{padding:10px;border-radius:8px;border:2px solid var(--line);font-size:1rem;background:var(--card);color:var(--ink)}
a.org{color:var(--mute);font-size:.8rem;cursor:pointer;text-decoration:underline}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px}summary{cursor:pointer;font-weight:700}textarea{width:100%;min-height:90px;margin:8px 0;padding:10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
</style></head><body><header><span class="co">🏗️ Sangregorio Construcción</span><h1>🎄 Postales de Navidad</h1><p>Obra navideña: vota las mejores postales de la plantilla ⛑️</p></header>
<main>
<div id="msg" class="note" hidden></div><div id="app"></div>
<p><a class="org" id="orgl">Soy organizador</a></p>
</main>
<script>
var SUPABASE_URL="https://cuwhrngvfvslxvhwqqox.supabase.co";
var SUPABASE_KEY="sb_publishable_gpbHa5kouOfRR2QvPePr9w_DfiMxg_9";
var CATS={adultos:"Adultos",ninos:"Niños"},MAXV=5,POLL=20000;
var $=function(i){return document.getElementById(i)};
var dni="",admin="",photos=[],st={show:false,admin:false,total:0,allowed:0,voted:{},tally:{}},cat="adultos",busy=false,sel={adultos:[],ninos:[]},txt="",open=false;
function say(t){var m=$("msg");m.textContent=t||"";m.hidden=!t}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
async function rpc(fn,args){
  var h={"Content-Type":"application/json",apikey:SUPABASE_KEY};
  if(SUPABASE_KEY.indexOf("eyJ")===0)h.Authorization="Bearer "+SUPABASE_KEY;
  var r;try{r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args)})}catch(e){throw new Error("Failed to fetch (revisa el Project URL)")}
  var t=await r.text(),j;try{j=JSON.parse(t)}catch(e){j=null}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||("HTTP "+r.status+" "+t.slice(0,120)));return j}
async function load(){
  try{var a={p_dni:dni,p_admin:admin};photos=await rpc("list_photos",a);st=await rpc("get_state",a);
    if(admin&&!st.admin){admin="";say("Clave de organizador incorrecta.")}else say("")}
  catch(e){var m=String(e.message);
    if(m.indexOf("dni_no")>=0){photos=[];if(admin){admin="";say("Clave de organizador incorrecta.")}else{dni="";say("Ese DNI no está autorizado. Revísalo o consulta con el organizador.")}}
    else say("No se pudo conectar. Detalle técnico: "+m)}
  render()}
function shrink(f){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};im.onerror=rej;im.src=u})}
async function up(fs){if(!fs||!fs.length||busy)return;busy=true;render();var n=0,m="";
  try{for(var i=0;i<fs.length;i++){say("Subiendo postal "+(i+1)+" de "+fs.length+"…");await rpc("add_photo",{p_admin:admin,p_cat:cat,p_img:await shrink(fs[i])});n++}m="¡"+n+" postal(es) subida(s) a "+CATS[cat]+"!"}
  catch(e){m="No se pudo subir la postal. Detalle técnico: "+e.message}
  busy=false;await load();say(m)}
async function send(){var ids=sel[cat];if(!ids.length||busy)return;
  if(!confirm("Vas a enviar "+ids.length+" voto(s) en "+CATS[cat]+". Después no podrás cambiarlos. ¿Enviar?"))return;
  busy=true;var m="";
  try{await rpc("submit_ballot",{p_dni:dni,p_cat:cat,p_photos:ids});sel[cat]=[];m="¡Votos enviados en "+CATS[cat]+"! Gracias por participar."}
  catch(e){m=e.message.indexOf("ya_votaste")>=0?"Ya habías votado en esta categoría.":"No se pudieron enviar los votos."}
  busy=false;await load();say(m)}
async function adm(fn,args,ok,q){if(q&&!confirm(q))return;try{var r=await rpc(fn,Object.assign({p_admin:admin},args||{}));await load();say(typeof ok==="function"?ok(r):ok)}catch(e){say("No se pudo completar la acción. Detalle técnico: "+e.message)}}
function csv(){var r=["Categoria;Postal;Votos"];Object.keys(CATS).forEach(function(k){
  photos.filter(function(p){return p.cat===k}).map(function(p,i){return{n:i+1,v:st.tally[p.id]||0}}).sort(function(a,b){return b.v-a.v}).forEach(function(x){r.push(CATS[k]+";Postal "+x.n+";"+x.v)})});
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+r.join("\n")],{type:"text/csv"}));a.download="resultados-postales.csv";a.click()}
function render(){var a=$("app");a.innerHTML="";
  if(!dni&&!admin){var n=el("div","note");n.appendChild(el("p","","Escribe tu DNI para entrar (solo se usa para comprobar que eres de la plantilla y que votas una vez; nunca se asocia a tu voto):"));
    var i=el("input");i.type="text";i.autocomplete="off";i.placeholder="12345678A";var b=el("button","","Entrar");b.style.marginLeft="8px";
    var go=function(){var v=i.value.trim();if(!v){say("Escribe tu DNI.");return}dni=v;load()};b.onclick=go;i.onkeydown=function(e){if(e.key==="Enter")go()};
    n.appendChild(i);n.appendChild(b);a.appendChild(n);return}
  var tabs=el("div","bar");Object.keys(CATS).forEach(function(k){var b=el("button","alt"+(k===cat?" on":""),(k==="adultos"?"👷 ":"🧒 ")+CATS[k]);b.onclick=function(){cat=k;render()};tabs.appendChild(b)});a.appendChild(tabs);
  if(st.admin){
    var d=el("details");d.open=open;d.ontoggle=function(){open=d.open};d.appendChild(el("summary","","🛠 Herramientas del organizador ("+st.total+" papeletas · "+st.allowed+" DNI autorizados)"));
    var bar=el("div","bar");bar.style.marginTop="10px";
    if(!st.show){var l=el("label","btn",busy?"Subiendo…":"📸 Subir postales ("+CATS[cat]+")");var f=el("input");f.type="file";f.accept="image/*";f.multiple=true;f.onchange=function(){up(f.files)};l.appendChild(f);bar.appendChild(l)}
    var sb=el("button","alt",st.show?"🙈 Ocultar votos (reabrir votación)":"👁 Mostrar votos");sb.onclick=function(){adm("set_show",{p_show:!st.show},"",st.show?"¿Ocultar los votos y reabrir la votación?":"¿Mostrar los votos a todos? La votación se cerrará.")};bar.appendChild(sb);
    if(st.show){var cb=el("button","alt","⬇ Guardar resultados (Excel/CSV)");cb.onclick=csv;bar.appendChild(cb)}
    d.appendChild(bar);
    d.appendChild(el("p","tag","Lista de DNI autorizados: pega uno por línea (o separados por comas). Se guardan cifrados."));
    var t=el("textarea");t.value=txt;t.placeholder="12345678A\n87654321B";t.oninput=function(){txt=t.value};d.appendChild(t);
    var lb=el("button","alt","Cargar DNI");lb.onclick=function(){adm("load_dnis",{p_list:txt},function(r){txt="";return"Lista cargada: "+r+" DNI autorizados."})};d.appendChild(lb);
    var rb=el("button","alt","Borrar todos los votos");rb.style.marginLeft="8px";rb.onclick=function(){adm("reset_votes",{},"Votos borrados y votación reabierta.","¿Borrar TODOS los votos y reabrir la votación? No se puede deshacer.")};d.appendChild(rb);
    a.appendChild(d)}
  var list=photos.filter(function(p){return p.cat===cat}),used=sel[cat].length,voted=st.voted&&st.voted[cat];
  var msg=st.show?"La votación ha terminado. Resultados de "+CATS[cat]+".":!dni?"Estás viendo la galería como organizador.":voted?"Ya has votado en esta categoría. Los resultados se verán al final.":"Elige hasta "+MAXV+" postales (llevas "+used+") y pulsa «Enviar mis votos». Una vez enviados no se pueden cambiar. Los resultados se verán al final.";
  a.appendChild(el("div","note",msg));
  if(!st.show&&dni&&!voted&&list.length){var sbtn=el("button","",("✅ Enviar mis votos ("+used+")"));sbtn.disabled=!used||busy;sbtn.onclick=send;var w=el("div","bar");w.appendChild(sbtn);a.appendChild(w)}
  if(st.show)list.sort(function(x,y){return (st.tally[y.id]||0)-(st.tally[x.id]||0)});
  var max=0;if(st.show)list.forEach(function(p){max=Math.max(max,st.tally[p.id]||0)});
  if(!list.length)a.appendChild(el("p","sub",st.admin?"Aún no hay postales. Usa «Herramientas del organizador» para subirlas.":"Aún no hay postales en esta categoría. ¡Enseguida empieza la votación!"));
  var g=el("div","grid");
  list.forEach(function(p){var on=sel[cat].indexOf(p.id)>=0,c=el("div","card"+(on?" sel":""));var im=el("img");im.src=p.img;im.alt="Postal";c.appendChild(im);
    var r=el("div","row"),t=el("span","tag","");
    if(st.show){var v=st.tally[p.id]||0;t=el("span",v===max&&max>0?"win":"tag",(v===max&&max>0?"🏆 Ganadora · ":"")+v+(v===1?" voto":" votos"))}
    r.appendChild(t);
    if(!st.show&&dni&&!voted){var vb=el("button","vote"+(on?" done":""),on?"✓ Elegida":"🎁 Elegir");
      vb.onclick=function(){var s=sel[cat],k=s.indexOf(p.id);if(k>=0)s.splice(k,1);else if(s.length>=MAXV){say("Máximo "+MAXV+" votos por categoría. Quita alguno para elegir otra.");return}else s.push(p.id);say("");render()};r.appendChild(vb)}
    if(st.admin&&!st.show){var x=el("button","alt","🗑 Eliminar");x.onclick=function(){adm("delete_photo",{p_id:p.id},"Postal eliminada.","¿Eliminar esta postal? También se borran sus votos.")};r.appendChild(x)}
    c.appendChild(r);g.appendChild(c)});a.appendChild(g)}
$("orgl").onclick=function(){var p=prompt("Clave de organizador:");if(p){admin=p;load()}};
render();setInterval(function(){if((dni||admin)&&!busy)load()},POLL);
</script></body></html>
